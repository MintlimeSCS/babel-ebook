name: Build Windows installer R04

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Match the toolchain used to validate this R04 release.
      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Check translation core and CLI
        run: cargo clippy --locked -p babel-ebook -p babel-ebook-cli --all-targets -- -D warnings
      - name: Test translation core
        run: cargo test --locked -p babel-ebook
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build desktop frontend
        working-directory: desktop
        run: pnpm build
      - name: Test desktop configuration
        run: cargo test --locked -p babel-ebook-desktop --lib config::tests
      - name: Build Windows installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BabelEbook-Windows-R04
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
